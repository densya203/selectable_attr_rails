name: test

on:
  push:
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
        rails: ['~> 6.1.0', '~> 7.1.0', '~> 7.2.0', '~> 8.0.0', '~> 8.1.0']
        exclude:
          # Rails 8.0 以降は Ruby 3.2 以上が必要
          - ruby: '3.1'
            rails: '~> 8.0.0'
          - ruby: '3.1'
            rails: '~> 8.1.0'
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
